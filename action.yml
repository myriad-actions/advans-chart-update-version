name: Helm Update Chart

description: Updates the application version in Chart.yaml and pushes the change to the repository.

inputs:
  iam-role-aws:
    description: 'The IAM role to assume for AWS credentials.'
    required: true
  aws-region:
    description: 'The AWS region to use.'
    required: true
    default: 'eu-central-1'
  env:
    description: "Deployment environment"
    required: true
  app:
    description: "Application name"
    required: true
  app_version:
    description: "Application version"
    required: true
  short_sha:
    description: "Short commit SHA"
    required: true
  gh_pat:
    description: "GitHub Personal Access Token"
    required: true
  gitops_chart_repos:
    description: "Github helm repos repository"
    required: true
  gitops_cd_repos:
    description: "Github CD repository"
    required: true
  github_path:
    description: 'The AWS region to use.'
    required: false
    default: 'main'
  organisation_repos:
    description: "Github Organization"
    required: true

runs:
  using: "composite"
  steps:
    # ------------------------------
    # Install Helm CLI
    # ------------------------------
    - name: Install Helm
      uses: azure/setup-helm@v5
      with:
        version: 'v3.19.0'
    
    # ------------------------------
    # Configure AWS credentials to assume role
    # ------------------------------
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6 # More information on this action can be found below in the 'AWS Credentials' section
      with:
        role-to-assume: ${{ inputs.iam-role-aws }}
        aws-region: ${{ inputs.aws-region }}
    
    # ------------------------------
    # Login to Amazon ECR (for Helm OCI registry)
    # ------------------------------
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    # ------------------------------
    # Checkout the App repo
    # ------------------------------
    - name: Checkout GitOps repository
      uses: actions/checkout@v7
      with:
        repository: "${{ inputs.organisation_repos }}/${{ inputs.app }}"
        path: "${{ inputs.app }}"
        token: "${{ inputs.gh_pat }}"

    # ------------------------------
    # Checkout the GitOps Helm chart repository
    # ------------------------------
    - name: Checkout GitOps repository
      uses: actions/checkout@v7
      with:
        repository: "${{ inputs.organisation_repos }}/${{ inputs.gitops_chart_repos }}"
        path: "${{ inputs.gitops_chart_repos }}"
        token: "${{ inputs.gh_pat }}"
        
    # ------------------------------
    # Checkout the CD repository (release manifests)
    # ------------------------------
    - name: Checkout CD repository
      uses: actions/checkout@v7
      with:
        repository: "${{ inputs.organisation_repos }}/${{ inputs.gitops_cd_repos }}"
        path: "${{ inputs.gitops_cd_repos }}"
        token: "${{ inputs.gh_pat }}"
        ref: "${{ inputs.github_branch }}"

    # ------------------------------
    # Update application's Chart.yaml
    # Always executed for demo and others 
    # Only executed after approval for prod
    # ------------------------------
    - name: Update App's version in Chart.yaml
      shell: bash
      working-directory: ${{ inputs.gitops_chart_repos }}/apps/${{ inputs.env }}/${{ inputs.app }}
      env:
        VERSION: "${{ inputs.app_version }}-${{ inputs.short_sha }}"
      run: |
        sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" Chart.yaml
        sed -i "s/^version: .*/version: \"${VERSION}\"/" Chart.yaml
      
    # ------------------------------
    # Package and push Helm chart to Amazon ECR
    # Always executed for demo and others 
    # Only executed after approval for prod
    # ------------------------------
    - name: Package and push helm chart to Amazon ECR
      shell: bash
      working-directory: ${{ inputs.gitops_chart_repos }}/apps/${{ inputs.env }}/${{ inputs.app }}
      env:
        VERSION: "${{ inputs.app_version }}-${{ inputs.short_sha }}"
      run: |
        helm lint .
        helm package .
        helm push ./${{ inputs.app }}-${VERSION}.tgz oci://${{ steps.login-ecr.outputs.registry }}/helm
    # ------------------------------
    # Set chart version in CD release.yaml
    # Always executed for demo and others 
    # Only executed after approval for prod
    # ------------------------------
    - name: Set chart version
      uses: mikefarah/yq@v4
      with:
        cmd: yq -i '.spec.chart.spec.version = strenv(VERSION)' '${{ inputs.gitops_cd_repos }}/apps/${{ inputs.env }}/${{ inputs.app }}/release.yaml'
      env:
        VERSION: "${{ inputs.app_version }}-${{ inputs.short_sha }}"
      
    # ------------------------------
    # Set chart version in CD release.yaml
    # Always executed for demo and others 
    # Only executed after approval for prod
    # ------------------------------    
    - name: Update Chart.yaml in CD repository and push changes
      shell: bash
      working-directory: ${{ inputs.gitops_cd_repos }}/apps/${{ inputs.env }}/${{ inputs.app }}
      env:
        CI_COMMIT_MESSAGE: "Update App Version to"
        CI_COMMIT_AUTHOR: "Continuous Deployment"
        VERSION: "${{ inputs.app_version }}-${{ inputs.short_sha }}"
        APP: "${{ inputs.app }}"
      run: |
        git config --global user.name "${CI_COMMIT_AUTHOR}"
        git config --global user.email "hub-devops@myriadgroup.com"
        git add release.yaml

        # Commit only if there is staged change
        if git diff --cached --quiet; then
          echo "No changes detected in release.yaml | skipping commit."
        else
          git commit -m "${CI_COMMIT_MESSAGE} ${VERSION} in release.yaml for ${APP}"
          git push origin HEAD
          echo "release.yaml updated and pushed with version ${VERSION}."
        fi 
